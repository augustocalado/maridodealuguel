<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando... | Marido de Aluguel</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
    }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,211,102,0.4); }
      50%       { transform: scale(1.05); box-shadow: 0 0 0 16px rgba(37,211,102,0); }
    }
    h1 { font-size: 20px; font-weight: 600; color: #e6edf3; text-align: center; }
    p  { font-size: 14px; color: #8b949e; text-align: center; max-width: 340px; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(37,211,102,0.2);
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback-link {
      display: inline-block; margin-top: 12px; padding: 12px 28px;
      background: #25D366; color: #fff; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 15px;
    }
    .fallback-link:hover { background: #20ba58; }
  </style>
</head>
<body>
  <div class="logo">💬</div>
  <h1>Conectando ao WhatsApp...</h1>
  <div class="spinner"></div>
  <p>Voce sera redirecionado em instantes para o nosso atendimento.</p>
  <div id="fallback-msg" style="display:none;text-align:center;">
    <p>Se nao for redirecionado automaticamente:</p>
    <a class="fallback-link" id="fallback-link" href="#">Abrir WhatsApp</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/supabase-config.js"></script>
  <script>
    (async () => {
      // ── Ler numero e mensagem gravados nas Configuracoes do painel ──
      const waConfig = JSON.parse(localStorage.getItem('mda_whatsapp_config') || '{}');

      // Fallback caso ainda nao tenha sido configurado no painel
      const NUMERO   = waConfig.numero   || '5511999999999';
      const MENSAGEM = waConfig.mensagem || 'Ola! Gostaria de solicitar um orcamento.';

      // ── Params da URL (origem/midia/campanha + conteudo/termo) ──
      const params   = new URLSearchParams(window.location.search);
      const origem   = params.get('origem')   || params.get('utm_source')   || 'direto';
      const midia    = params.get('midia')    || params.get('utm_medium')   || null;
      const campanha = params.get('campanha') || params.get('utm_campaign') || null;
      const conteudo = params.get('conteudo') || params.get('utm_content')  || null;
      const termo    = params.get('termo')    || params.get('utm_term')     || null;

      // ── URL do WhatsApp ──
      const encodedMsg  = encodeURIComponent(MENSAGEM);
      const whatsappURL = `https://wa.me/${NUMERO}?text=${encodedMsg}`;

      // Fallback apos 3s
      setTimeout(() => {
        document.getElementById('fallback-msg').style.display = 'block';
        document.getElementById('fallback-link').href = whatsappURL;
      }, 3000);

      // ── Registrar clique no Supabase ──
      try {
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const base = {
          origem,
          midia,
          campanha,
          referrer:   document.referrer || null,
          user_agent: navigator.userAgent,
        };
        const insert = (payload) =>
          client.from('whatsapp_clicks').insert(payload).then((res) => (res && res.error) || null);

        // Tenta gravar conteudo/termo; se as colunas ainda nao existirem,
        // refaz o insert apenas com as colunas originais (nao perde o registro).
        let error = await insert(Object.assign({}, base, { conteudo, termo }));
        if (error && (conteudo || termo)) {
          error = await insert(base);
        }
        if (error) {
          console.warn('Tracking skipped:', error.message || error);
        }
      } catch (e) {
        console.warn('Tracking skipped:', e);
      }

      // ── Redirecionar ──
      window.location.href = whatsappURL;
    })();
  </script>
</body>
</html>
