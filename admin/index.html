<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Admin | Marido de Aluguel Guarulhos</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">🔧</div>
        <h1 class="login-title">Área Administrativa</h1>
        <p class="login-subtitle">Marido de Aluguel Guarulhos</p>
      </div>

      <div class="login-error" id="login-error">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="error-msg">E-mail ou senha incorretos.</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-control" type="email" id="email" placeholder="admin@exemplo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <div style="position:relative">
            <input class="form-control" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="toggle-pass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:15px;padding:4px;">
              <i class="fas fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="login-btn" style="width:100%;margin-top:8px;justify-content:center;">
          <span id="btn-text"><i class="fas fa-sign-in-alt"></i> &nbsp;Entrar</span>
          <span id="btn-loading" style="display:none;align-items:center;gap:8px;"><span class="spinner"></span> Entrando...</span>
        </button>
      </form>

      <p style="text-align:center;margin-top:24px;font-size:12px;color:var(--text-muted);">
        <i class="fas fa-lock" style="margin-right:4px;"></i> Acesso restrito a administradores autorizados
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Redirect if already logged in
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    // Toggle password visibility
    document.getElementById('toggle-pass').addEventListener('click', () => {
      const pass = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        pass.type = 'password';
        icon.className = 'fas fa-eye';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      const btnText = document.getElementById('btn-text');
      const btnLoading = document.getElementById('btn-loading');

      errorEl.style.display = 'none';
      btnText.style.display = 'none';
      btnLoading.style.display = 'flex';
      document.getElementById('login-btn').disabled = true;

      const { error } = await db.auth.signInWithPassword({ email, password });

      btnText.style.display = 'flex';
      btnLoading.style.display = 'none';
      document.getElementById('login-btn').disabled = false;

      if (error) {
        errorEl.style.display = 'flex';
        document.getElementById('error-msg').textContent = 'E-mail ou senha incorretos. Tente novamente.';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
